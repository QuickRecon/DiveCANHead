CONFIG_ZTEST=y
CONFIG_LOG=y

# ADC + the board-local multi-channel ADS1X1X driver under test. Disable the
# upstream single-channel driver so only one instantiates the ti,ads1115 node.
CONFIG_ADC=y
CONFIG_ADC_ADS1X1X=n
CONFIG_ADC_ADS1X1X_LOCAL=y

# Emulated I2C bus + emulator subsystem for the ADS1115 register model.
CONFIG_I2C=y
CONFIG_I2C_EMUL=y
CONFIG_EMUL=y
