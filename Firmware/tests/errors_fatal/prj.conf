# errors.c under test. It defines chan_error (zbus) and routes every fatal
# path through k_sys_fatal_error_handler -> sys_reboot (wrapped by the test).
CONFIG_ZTEST=y
CONFIG_LOG=y
CONFIG_ZBUS=y
CONFIG_REBOOT=y

# k_sys_fatal_error_handler() prints k_thread_name_get(k_current_get()); with
# CONFIG_THREAD_NAME off that returns NULL and the printk "%s" is unsafe.
CONFIG_THREAD_NAME=y
