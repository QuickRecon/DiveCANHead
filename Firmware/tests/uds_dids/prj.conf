CONFIG_ZTEST=y
CONFIG_LOG=y
CONFIG_ZBUS=y

# uds.c uses k_uptime_get_32. sys_reboot is wrapped but the header
# requires CONFIG_REBOOT for the prototype to be visible.
CONFIG_REBOOT=y

# Same rationale as tests/uds_ota: we deliberately do NOT enable
# BOOTLOADER_MCUBOOT — it y-selects USE_DT_CODE_PARTITION which doesn't
# apply to native_sim. All boot_* and flash_area_* symbols are wrapped,
# so we never reach the real implementations. The headers we need are
# always available.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# 1 ms tick resolution. The dive-gate tests claim the pressure channel and
# release it 15 ms later so it sits between uds.c's two 10 ms zbus reads
# (session maintenance vs handler gate). native_sim's default 100 Hz tick
# quantizes the 10 ms read timeout and the 15 ms release to the same 20 ms
# boundary, making the outcome tick-order dependent.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
