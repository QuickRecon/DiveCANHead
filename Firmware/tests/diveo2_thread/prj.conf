CONFIG_ZTEST=y
CONFIG_LOG=y
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_REBOOT=y

# ---- Emulated async UART for the DiveO2 cell thread ----
CONFIG_SERIAL=y
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_UART_ASYNC_API=y

# ---- Settings (runtime handlers only; no NVS backend needed) ----
# diveo2_load_cal() reads "cal/cellN" via settings_runtime_get(); the test
# registers a static "cal" handler. runtime_settings.c registers its own "rt"
# handler. Neither needs a storage backend for the get/set-volatile paths used
# here, so CONFIG_SETTINGS_NVS is deliberately omitted.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# ---- Product topology: one DiveO2 cell so exactly diveo2_thread_1 spawns ----
CONFIG_CELL_COUNT=1
CONFIG_CELL_1_TYPE_DIVEO2=y
