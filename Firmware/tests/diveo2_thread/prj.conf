CONFIG_ZTEST=y
CONFIG_LOG=y
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_REBOOT=y

# ---- Emulated async UART for the DiveO2 cell thread ----
CONFIG_SERIAL=y
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_UART_ASYNC_API=y

# ---- Settings (runtime get + null storage backend) ----
# diveo2_load_cal() reads "cal/cellN" via settings_runtime_get(), served by the
# real calibration_store "cal" handler (linked in); the test seeds coefficients
# into that store's cache directly (calibration_store_seed_cached). load_cal
# first calls calibration_load_coefficients(), which runs settings_subsys_init()
# + settings_load_subtree("cal"); CONFIG_SETTINGS_NONE makes those safe no-ops
# so no real NVS backend is required. runtime_settings.c registers "rt".
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_NONE=y

# ---- Product topology: one DiveO2 cell so exactly diveo2_thread_1 spawns ----
CONFIG_CELL_COUNT=1
CONFIG_CELL_1_TYPE_DIVEO2=y
