CONFIG_ZTEST=y
CONFIG_LOG=y

# GPIO (emulated) + counter (native-sim) back the solenoid driver.
CONFIG_GPIO=y
CONFIG_COUNTER=y

# errors.h (included by solenoid.c for OP_ERROR_DETAIL) pulls in zbus types;
# op_error_publish itself is stubbed in the test binary.
CONFIG_ZBUS=y

# The real solenoid driver under test. Current-check stays off (default) so the
# plain GPIO/deadman paths are what get exercised here.
CONFIG_SOLENOID=y
