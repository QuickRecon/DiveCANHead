CONFIG_ZTEST=y

# FLASH_LOG only supplies the LOG_PUSH_FORCE_INF_* Kconfig symbols the backend
# references; flash_log.c is NOT linked (flash_log_get_rtt_level is stubbed).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y
CONFIG_FLASH_LOG=y

# Deferred logging with the processing thread OFF so the test pumps the queue
# via log_process() and drives the backend deterministically.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=n

# Compile-time force-list. Leading spaces, a doubled comma, an over-long name
# (truncated + tail discarded) and an unknown trailing name exercise every arm
# of upb_resolve_force()'s tokeniser. "test_forced_mod" is the only resolvable
# entry.
CONFIG_LOG_PUSH_FORCE_INF_MODULES="  test_forced_mod,,averylongmodulenamethatexceedsthirtyonecharacterseasily nonexistent_mod"
