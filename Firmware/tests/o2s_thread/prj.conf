CONFIG_ZTEST=y
CONFIG_LOG=y
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_REBOOT=y

# ---- Emulated async UART for the O2S cell thread ----
CONFIG_SERIAL=y
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_UART_ASYNC_API=y

# ---- Settings (runtime handlers only; no NVS backend needed) ----
# o2s_load_cal() reads "cal/cellN" via settings_runtime_get(); the test
# registers a static "cal" handler. No storage backend is needed for the
# get path used here, so CONFIG_SETTINGS_NVS is deliberately omitted.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# ---- Product topology: one O2S cell so exactly o2s_thread_1 spawns ----
CONFIG_CELL_COUNT=1
CONFIG_CELL_1_TYPE_O2S=y
