# Coverage overlay for native_sim builds (ztest binaries + integration build).
#
# Layered on top of a test's own prj.conf (and, for the integration build,
# on top of variants/dev_full.conf + tests/integration/integration.conf) by
# the coverage tooling — never applied to firmware-image builds.
#
# Wires the host compiler's gcov-compatible coverage instrumentation:
#   * -fprofile-arcs -ftest-coverage -fno-inline on every compiled TU
#   * libgcov linked in so __gcov_exit() flushes .gcda on process exit
#
# Each test/integration build lives under build-coverage/<name>/ so the
# instrumented .gcno/.gcda artefacts do not collide with the regular
# build-native/<name>/ tree.

CONFIG_COVERAGE=y
CONFIG_COVERAGE_NATIVE_GCOV=y

# -fno-inline (added by --coverage) bloats the .text segment substantially.
# Bump the per-thread stack-usage cap so build-coverage builds don't trip
# -Wstack-usage on functions that fit comfortably without instrumentation.
# (Only matters if a TU enables -Wstack-usage, which the app does.)
CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
