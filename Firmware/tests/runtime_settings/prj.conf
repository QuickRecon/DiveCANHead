CONFIG_ZTEST=y
CONFIG_LOG=y

# Real settings persistence over NVS on the native_sim flash_simulator
# (storage_partition @ 0xfc000 in the native_sim DTS). This exercises the
# genuine save -> reload round-trip path that the HIL config suite leans on,
# so quantization, zero-value, and coherence behaviours surface here rather
# than only as flaky HIL reds.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
