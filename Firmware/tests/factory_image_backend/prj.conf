CONFIG_ZTEST=y
CONFIG_LOG=y

# errors.c publishes OP_ERROR events on its own zbus channel and reboots
# on fatal paths.
CONFIG_ZBUS=y
CONFIG_REBOOT=y

# Real flash_simulator behind the flash_area API — the backend under test
# talks to the factory_partition declared in boards/native_sim.overlay.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Settings core for the SETTINGS_STATIC_HANDLER_DEFINE registration and the
# __real_ aliases behind the wrapped settings_save_one/settings_load_subtree.
# The storage backend is never reached (both entry points are wrapped), so
# the no-op backend keeps the build minimal. SETTINGS_RUNTIME provides
# settings_runtime_set(), which drives factory_flag_settings_set directly.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
CONFIG_SETTINGS_RUNTIME=y
