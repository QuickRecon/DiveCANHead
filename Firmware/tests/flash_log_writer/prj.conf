CONFIG_ZTEST=y
CONFIG_LOG=y

# native_sim defaults to 100 Hz ticks, which rounds every k_msleep(1) up
# to ~10 ms. The batch-buffer overflow test must stage >4096 bytes of
# records inside one 2 s flush window, so sleeps need millisecond
# granularity.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Real FCBs on the native_sim flash_simulator, in dedicated fixed
# partitions (see boards/native_sim.overlay). Shrunk geometry: 8 KiB
# logical sectors (a multiple of the simulator's 4 KiB erase block) so
# ring rotation and the 4 KiB batch-buffer overflow path are reachable
# in a handful of writes. Partition sizes in the overlay must equal
# sector-count x sector-size.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_LOG=y
CONFIG_FLASH_LOG_SECTOR_SIZE=8192
CONFIG_FLASH_LOG_TELEMETRY_SECTOR_COUNT=4
CONFIG_FLASH_LOG_TEXT_SECTOR_COUNT=3

# Real settings persistence over NVS on the stock storage_partition
# (as in tests/runtime_settings), so flash_log_init's
# settings_load_subtree("log") exercises fl_settings_set through the
# genuine backend. SETTINGS_RUNTIME adds the direct-injection path used
# to drive the invalid-key / invalid-length / out-of-range arms.
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y
