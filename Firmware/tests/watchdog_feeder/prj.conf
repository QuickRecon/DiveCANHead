CONFIG_ZTEST=y
CONFIG_LOG=y
# errors.c (linked for FATAL_OP_ERROR) references sys_reboot.
CONFIG_REBOOT=y
# The feeder compiles in when CONFIG_DIVECAN_WATCHDOG=y (default y once
# WATCHDOG is on). The watchdog0 alias points at a devicetree node the
# test claims with its own scripted wdt device — no real wdt driver is
# enabled, mirroring the scripted-device pattern used elsewhere in
# tests/ for buses native_sim cannot emulate.
CONFIG_WATCHDOG=y
CONFIG_DIVECAN_WATCHDOG=y
# The counter-watchdog compatible would auto-select this driver, which
# then defines the same DT device the scripted API below claims.
CONFIG_WDT_COUNTER=n
