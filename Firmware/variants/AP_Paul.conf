# AP_Paul — classic single-solenoid eCCR head, PID control, 1S lithium
# 3x analog galvanic cells, single O2 solenoid (channel 0)
# PID control default, flush calibration (via inject solenoid), depth comp
# Battery with CAN fallback, 1S lithium (3.7V)

# Cells
CONFIG_CELL_COUNT=3
CONFIG_CELL_1_TYPE_ANALOG=y
CONFIG_CELL_2_TYPE_ANALOG=y
CONFIG_CELL_3_TYPE_ANALOG=y

# Power
CONFIG_POWER_MODE_BATTERY_THEN_CAN=y
CONFIG_BATTERY_CHEMISTRY_LI1S=y

# Solenoids — single O2 inject on channel 0, no dedicated flush/diluent
CONFIG_SOL_O2_INJECT_CHANNEL=0
CONFIG_SOL_O2_INJECT_2_CHANNEL=-1
CONFIG_SOL_O2_FLUSH_CHANNEL=-1
CONFIG_SOL_DIL_FLUSH_CHANNEL=-1

# Defaults
CONFIG_PPO2_CONTROL_DEFAULT_PID=y
CONFIG_CAL_MODE_DEFAULT_FLUSH=y
CONFIG_DEPTH_COMPENSATION_DEFAULT=y
