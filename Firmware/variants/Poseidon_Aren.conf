# Poseidon_Aren — 2-cell DiveO2 head
# 2x DiveO2 digital cells; solenoid mapping + control/cal/depth defaults
# match dev_full (all 4 solenoid channels, PID, flush cal, depth comp)
# Battery only, 1S lithium

# Cells
CONFIG_CELL_COUNT=2
CONFIG_CELL_1_TYPE_DIVEO2=y
CONFIG_CELL_2_TYPE_DIVEO2=y

# Power
CONFIG_POWER_MODE_BATTERY=y
CONFIG_BATTERY_CHEMISTRY_LI1S=y
CONFIG_POSEIDON_ACCESSORIES=y

# Closed-loop solenoid current check. Enabled here (not a global default) because
# this variant registers the DS2782 current provider via POSEIDON_ACCESSORIES.
# Window = the measured Poseidon solenoid coil draw at the pack voltage:
# a healthy fire adds 150-250 mA over idle; below reads UNDER (open coil / boost
# fault), above reads OVER (short). The rig overlay (rig_solcurrent.conf) narrows
# this to bracket its resistive load bank instead.
CONFIG_SOLENOID_CURRENT_CHECK=y
CONFIG_SOLENOID_CURRENT_DELTA_MIN_UA=80000
CONFIG_SOLENOID_CURRENT_DELTA_MAX_UA=150000

# Stream poseidon_accessories INF telemetry (DS2782 current solicit/readings) to
# the BT diagnostics over CAN without globally raising log verbosity. Compile-time
# per-module elevation on the CAN push backend only; the global level stays WRN.
CONFIG_LOG_PUSH_FORCE_INF_MODULES=""

# Solenoids — all 4 channels active (same as dev_full)
CONFIG_SOL_O2_INJECT_CHANNEL=0
CONFIG_SOL_O2_INJECT_2_CHANNEL=1
CONFIG_SOL_O2_FLUSH_CHANNEL=3
CONFIG_SOL_DIL_FLUSH_CHANNEL=2

# Setpoint-change flush: 3 s burst on the matching flush solenoid when the
# diver commands a new setpoint (O2 flush on increase, dil flush on
# decrease). Must stay under the 5.5 s solenoid deadman window
# (BUILD_ASSERT-enforced in ppo2_control.c).
CONFIG_SOL_FLUSH_TIME=3000

# Defaults (same as dev_full)
CONFIG_PPO2_CONTROL_DEFAULT_PID=y
# All-digital head (2x DiveO2): cells self-report PPO2, so there is no analog
# coefficient to compute. Default the diver-triggered "calibration" to the
# CHECK sensor check (O2 + diluent flush, always OK, no recal) instead of a
# flush-then-total-absolute cal.
CONFIG_CAL_MODE_DEFAULT_CHECK=y
CONFIG_DEPTH_COMPENSATION_DEFAULT=y

# HP tank pressure transducers — analog senders on the (otherwise unused)
# analog-cell ADC inputs: O2 on channel 0 (ADS1115 @0x48 AIN0-AIN1), dil on
# channel 1 (AIN2-AIN3). 300 mV = 0 bar, 1800 mV = 300 bar; readings outside
# that window go out on the wire as the 0xFFFF error value. The matching
# overlay re-enables adc_ext1 with ADC_GAIN_1 so the 1.8 V swing fits.
CONFIG_O2_TRANSDUCER_CHANNEL=1
CONFIG_O2_TRANSDUCER_MIN=300
CONFIG_O2_TRANSDUCER_MAX=3000
CONFIG_O2_TRANSDUCER_LIMIT=300
CONFIG_DIL_TRANSDUCER_CHANNEL=0
CONFIG_DIL_TRANSDUCER_MIN=300
CONFIG_DIL_TRANSDUCER_MAX=3000
CONFIG_DIL_TRANSDUCER_LIMIT=300

# The ADS1115 acquisition thread on this variant only services the 2 Hz tank
# pressure sampler (no analog cells), and its work is shallow: sem-take, I2C
# ready-poll, sem-give (upstream Zephyr defaults this stack to 400 B; the
# local fork's default is a conservative 1024). 640 recovers the RAM the
# transducer feature costs on the tightly-packed L431. Verify with the
# CONFIG_THREAD_ANALYZER 30 s report on first flash before trimming further.
CONFIG_ADC_ADS1X1X_LOCAL_ACQUISITION_THREAD_STACK_SIZE=640

# i2c1 is shared multi-master here: the Poseidon accessory bus (target + master)
# and the tank-pressure ADS1115 (master) coexist. Because a registered i2c
# target keeps the STM32 peripheral permanently enabled, a BUSY flag latched by
# an external-master collision never self-clears and wedges every ADS read
# (intermittent "ADS1X1X: error writing register 0x1 (-16)" that latches). Bus
# recovery lets tank_pressure bit-bang a STOP (via the board's scl/sda-gpios) to
# clear it. Off on the other variants, which never register a target.
CONFIG_I2C_STM32_BUS_RECOVERY=y
