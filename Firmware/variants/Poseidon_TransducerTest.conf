# Poseidon_TransducerTest — HIL dev variant of Poseidon_Aren
#
# Identical to Poseidon_Aren EXCEPT the HP tank-pressure transducer window is
# scaled into the rig CellSimulator's 0..~260 mV analog-output range so the
# transducer ADC->zbus->CAN path can be exercised end-to-end on real silicon.
# The stock Poseidon_Aren window (MIN 300 / MAX 3000 mV) sits entirely above the
# CellSim ceiling, so pressure can't be swept there. tank_pressure_mv_to_decibar
# is a pure linear map, so scaling MIN/MAX preserves the code path exactly (same
# clamp, same 0xFFFF out-of-range, same round-half-up). NOT a production build —
# used only to qualify commit 7a6b67f on the rig (see tests/test_dut_tank_pressure.py).

# Cells
CONFIG_CELL_COUNT=2
CONFIG_CELL_1_TYPE_DIVEO2=y
CONFIG_CELL_2_TYPE_DIVEO2=y

# Power
CONFIG_POWER_MODE_BATTERY=y
CONFIG_BATTERY_CHEMISTRY_LI1S=y
CONFIG_POSEIDON_ACCESSORIES=y

# Solenoids — all 4 channels active (same as Poseidon_Aren)
CONFIG_SOL_O2_INJECT_CHANNEL=0
CONFIG_SOL_O2_INJECT_2_CHANNEL=1
CONFIG_SOL_O2_FLUSH_CHANNEL=2
CONFIG_SOL_DIL_FLUSH_CHANNEL=3
CONFIG_SOL_FLUSH_TIME=3000

# Defaults (same as Poseidon_Aren)
CONFIG_PPO2_CONTROL_DEFAULT_PID=y
CONFIG_CAL_MODE_DEFAULT_FLUSH=y
CONFIG_DEPTH_COMPENSATION_DEFAULT=y

# HP tank pressure transducers — SCALED window for the rig CellSim.
# Channel assignment unchanged from Poseidon_Aren (post-0c53ff8 swap): O2 on
# channel 1 (adc_ext1 AIN2-AIN3, rig CellSim cell 2), dil on channel 0 (AIN0-
# AIN1, rig CellSim cell 1). 20 mV = 0 bar, 200 mV = 300 bar; the CellSim's
# ~260 mV ceiling lets a test drive above 200 mV to exercise the 0xFFFF
# out-of-range path, and below 20 mV for the open/short-low path.
CONFIG_O2_TRANSDUCER_CHANNEL=1
CONFIG_O2_TRANSDUCER_MIN=20
CONFIG_O2_TRANSDUCER_MAX=200
CONFIG_O2_TRANSDUCER_LIMIT=300
CONFIG_DIL_TRANSDUCER_CHANNEL=0
CONFIG_DIL_TRANSDUCER_MIN=20
CONFIG_DIL_TRANSDUCER_MAX=200
CONFIG_DIL_TRANSDUCER_LIMIT=300

# Same ADS acquisition-thread stack + i2c1 bus recovery as Poseidon_Aren.
CONFIG_ADC_ADS1X1X_LOCAL_ACQUISITION_THREAD_STACK_SIZE=640
CONFIG_I2C_STM32_BUS_RECOVERY=y
