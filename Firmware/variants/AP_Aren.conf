# AP_Aren — AP-style single-solenoid head
# 3x DiveO2 digital cells, single O2 solenoid (channel 0)
# MK15 OEM control, flush calibration (via inject solenoid), depth comp
# Battery only, 2S lithium

# Cells
CONFIG_CELL_COUNT=3
CONFIG_CELL_1_TYPE_DIVEO2=y
CONFIG_CELL_2_TYPE_DIVEO2=y
CONFIG_CELL_3_TYPE_DIVEO2=y

# Power
CONFIG_POWER_MODE_BATTERY=y
CONFIG_BATTERY_CHEMISTRY_LI2S=y

# Solenoids — single O2 inject on channel 0, no dedicated flush/diluent
CONFIG_SOL_O2_INJECT_CHANNEL=0
CONFIG_SOL_O2_INJECT_2_CHANNEL=-1
CONFIG_SOL_O2_FLUSH_CHANNEL=-1
CONFIG_SOL_DIL_FLUSH_CHANNEL=-1

# Defaults
CONFIG_PPO2_CONTROL_DEFAULT_MK15=y
CONFIG_CAL_MODE_DEFAULT_FLUSH=y
CONFIG_DEPTH_COMPENSATION_DEFAULT=y

# LF transmitter — proprietary out-of-tree module on TIM1_CH1N / PA7.
# Requires proprietary/lf_tx/ to be populated (see proprietary/README.md);
# the build fails clearly if it is not. PA7 is freed from the solenoid list in
# the matching overlay. The 12-bit transmitter ID is a per-unit NVS setting
# (UDS DID 0x935B) provisioned per unit; CONFIG_LF_TX_ID_DEFAULT is the
# factory-fresh seed applied before provisioning (375 for this bringup unit).
CONFIG_WANT_LF_TX=y
CONFIG_LF_TX_ID_DEFAULT=375
