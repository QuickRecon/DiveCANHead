# Sidewinder_Gabriel
# 3x DiveO2 digital cells, no solenoid (manual CCR)
# No PPO2 control, Total absolute cal
# Battery only, 2S lithium

# Cells
CONFIG_CELL_COUNT=3
CONFIG_CELL_1_TYPE_DIVEO2=y
CONFIG_CELL_2_TYPE_DIVEO2=y
CONFIG_CELL_3_TYPE_DIVEO2=y

# Power
CONFIG_POWER_MODE_BATTERY=y
CONFIG_BATTERY_CHEMISTRY_LI2S=y

# Solenoid — none. Manual CCR with no oxygen solenoid. Disabling the
# driver removes the entire Solenoid Role Mapping menu (HAS_O2_SOLENOID=n),
# which forces PPO2 control OFF and makes depth compensation unavailable.
CONFIG_SOLENOID=n

# Defaults
CONFIG_PPO2_CONTROL_DEFAULT_OFF=y
CONFIG_CAL_MODE_DEFAULT_TOTAL_ABSOLUTE=y
