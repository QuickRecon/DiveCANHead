# Sidewinder_Gabriel
# 3x DiveO2 digital cells, no solenoid
# No control control, Total absolute cal
# Battery only, 1S lithium

# Cells
CONFIG_CELL_COUNT=3
CONFIG_CELL_1_TYPE_DIVEO2=y
CONFIG_CELL_2_TYPE_DIVEO2=y
CONFIG_CELL_3_TYPE_DIVEO2=y

# Power
CONFIG_POWER_MODE_BATTERY=y
CONFIG_BATTERY_CHEMISTRY_LI2S=y

# Solenoids — single O2 inject on channel 0, no dedicated flush/diluent
CONFIG_SOL_O2_INJECT_CHANNEL=0
CONFIG_SOL_O2_INJECT_2_CHANNEL=-1
CONFIG_SOL_O2_FLUSH_CHANNEL=-1
CONFIG_SOL_DIL_FLUSH_CHANNEL=-1

# Defaults
CONFIG_PPO2_CONTROL_DEFAULT_OFF=y
CONFIG_CAL_MODE_DEFAULT_TOTAL_ABSOLUTE=y
CONFIG_DEPTH_COMPENSATION_DEFAULT=y
