# Rig closed-loop-solenoid-current validation overlay (NOT a standalone variant).
#
# Layer on top of a real variant to bracket the HIL rig's resistive solenoid
# load bank, whose fire-current deltas at 3.7 V are below the real Poseidon
# solenoid coil's 150-250 mA production window (set in Poseidon_Aren.conf):
#
#   270 ohm -> 13.7 mA   150 ohm -> 24.7 mA   68 ohm -> 54.4 mA
#    39 ohm -> 94.9 mA    18 ohm -> 205.6 mA   open -> ~0 mA
#
# With this 40-120 mA window: 270/150 ohm + open read UNDER, 68/39 ohm read
# NORM, 18 ohm reads OVER — a full three-way + open-circuit sweep on real
# hardware. (The DS2782 shunt stays at the production 40 mOhm default, so the
# HIL feedback's uA<->count conversion matches the firmware.) Build e.g.:
#   -DEXTRA_CONF_FILE="variants/Poseidon_Aren.conf;variants/rig_solcurrent.conf"
# The variant name baked into the binary stays that of the first conf.
CONFIG_SOLENOID_CURRENT_DELTA_MIN_UA=40000
CONFIG_SOLENOID_CURRENT_DELTA_MAX_UA=120000
