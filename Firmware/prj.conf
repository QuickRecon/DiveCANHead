CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# Hardening (applied globally — Zephyr + app)
# Entropy/RNG disabled — entropy_stm32_rng_init asserts during init on Jr
# hardware (PC=assert_post_action, LR=entropy_stm32.c:862, reason=
# K_ERR_KERNEL_PANIC). Just commenting out CONFIG_ENTROPY_GENERATOR is
# NOT enough: the STM32 RNG driver's Kconfig auto-enables when the DT
# rng node is "okay", which selects ENTROPY_HAS_DRIVER which pulls in
# ENTROPY_GENERATOR. The override below forces the driver off so the
# init function never runs. Root cause is likely PLL Q clock config
# for CLK48 mux — leaves the RNG without a clock, dev->data deref
# faults. TODO: revisit clock setup so we can re-enable HW entropy.
# CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=n
CONFIG_FORTIFY_SOURCE_RUN_TIME=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
CONFIG_OVERRIDE_FRAME_POINTER_DEFAULT=y

# Stack canaries — guard word at the bottom of every function's stack
# frame, checked at epilogue. Catches return-address smashing from
# buffer overflows (the dominant software-bug failure mode in C). The
# _STRONG variant covers any function with a local array OR taking
# the address of a local, which is what we want — bog-standard
# _REGULAR only protects functions with char buffers ≥8 bytes and
# misses most real overflow targets. Canary seed comes from a build-
# time random word via the SDK; not cryptographically strong but the
# threat model here is software bugs, not adversarial bypass.
CONFIG_STACK_CANARIES=y
CONFIG_STACK_CANARIES_STRONG=y

# Hardware FPU — DELIBERATELY OFF, measured 2026-07. The M4F single-precision
# FPU looks free but is not: safe multi-thread FP requires CONFIG_FPU_SHARING
# (float math runs in PID, consensus, cell, and cal threads), and on this
# build that costs ~3.2 KB of RAM — 64 B of callee-saved FP context appended
# to every struct k_thread (~22 threads) plus the MPU stack guard widening
# from 32 B to 128 B per stack for lazy-stacking overlap. The Poseidon build
# sits at ~99.8% RAM, so enabling it overflowed the region by 3,184 B for a
# ~2.5 KB FLASH saving (single-precision softfloat elimination). Softfloat
# single is fast enough for the 100 ms control cadence. REVISIT if the
# thread count drops substantially (consolidation shrinks the per-thread
# tax) or if RAM headroom appears.
# CONFIG_FPU=y
# CONFIG_FPU_SHARING=y

# Link-time optimization — REJECTED 2026-07 on HIL A/B evidence, despite a
# −21.6 KB (−11%) app-image saving. With CONFIG_LTO=y (+
# CONFIG_ISR_TABLES_LOCAL_DECLARATION=y) the DUT reproducibly failed
# test_dut_services.py::test_factory_default_battery_threshold_matches_manifest:
# after the NVS-erase DID (0xF279) warm reboot the head came back NOT
# broadcasting PPO2 (UDS still answered; a cold power cycle recovered it).
# 3/3 fail with LTO, 3/3 pass on the byte-identical source tree without
# LTO, 3/3 pass on the pre-change baseline. Root cause not isolated (LTO
# inlining/reordering exposing a latent init race, or a miscompile) — an
# unexplained behavioral delta is disqualifying on a life-support device.
# Re-attempt only WITH a root cause. Repro: seed a non-default battery
# setting, programming session, write 0xF279=0x01, wait for the PPO2
# broadcast to resume (it doesn't). If re-attempted, remember: size(1)
# misreports LTO rodata as `data` (use the linker region table) and
# -fstack-usage/.su static WCS numbers degrade under LTO.
# CONFIG_LTO=y
# CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Main thread stack — kept at 2048 after a 1024 trim caused a
# K_ERR_STACK_CHK_FAIL canary trip on real hardware. Static WCS came
# back "unbounded" for main because settings/MCUBoot/SPI inits hit
# function-pointer call paths the analyzer can't trace; runtime
# evidence is the only reliable bound. Revisit only with INIT_STACKS
# high-water-mark data from a real boot.
CONFIG_MAIN_STACK_SIZE=2048

# Assertions (kept in production — controlled reboot over undefined behavior)
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y

# Fixed libc malloc arena. The default ARENA_SIZE=-1 ("all leftover RAM")
# makes boot depend on how full RAM is: when a variant's static allocation
# reached the top of RAM (Poseidon_Aren, 2026-08), malloc_prepare's
# sys_heap_init(size=0) asserted -> k_panic -> silent pre-banner reboot
# loop before any log output. A fixed size turns that failure mode into a
# link-time RAM-overflow error instead. The only runtime malloc user is
# mbedtls (PSA SHA-256 for OTA image validation seeds HMAC-DRBG via
# mbedtls_md_setup -> calloc, a few hundred bytes); 1024 matches the
# leftover-RAM arenas the previously HIL-qualified builds ran with.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1024

# Printf/cbprintf size trims — app code has no %lld/%llu and no
# LOG_DBG callsites (verified via grep), so the FULL_INTEGRAL formatter
# table and the function-name prefix infrastructure are dead weight in
# this binary. Switching to REDUCED_INTEGRAL keeps %d/%u/%x/%s/%c/%p
# but drops the long-long path. PICOLIBC_IO_LONG_LONG mirrors the same
# trim on the picolibc side for stdio.
# Saves ~1-2 KB FLASH each. Revisit if any new LOG_x site needs %lld.
CONFIG_CBPRINTF_FULL_INTEGRAL=n
CONFIG_CBPRINTF_REDUCED_INTEGRAL=y
CONFIG_PICOLIBC_IO_LONG_LONG=n
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n

# Logging — deferred mode. Buffer reduced from 2 KB to 1 KB to free
# RAM; the processing thread runs at high priority (3) so the buffer
# drains quickly and a smaller staging area is fine for the bursts
# we actually see. Watch dropped_cnt in the RTT log_core stats — if
# it climbs noticeably under real workloads, bump back to 2048.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_LOG_PROCESS_THREAD_PRIORITY=3
# RTT up-buffer at 2 KB. Both MCUBoot and this app place
# SEGGER_RTT_SECTION_CUSTOM at RAM base, then lay it out as
# _acUpBuffer + _acDownBuffer + _SEGGER_RTT. The buffer size must
# match between binaries or the control block ends up at different
# addresses — openocd attaches to whichever address it finds first
# (MCUBoot's, since its address is lower) and stays locked there
# after MCUBoot chainloads, so the app's logs vanish into a control
# block that openocd never reads. sysbuild/mcuboot.conf carries a
# matching CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048 to keep both
# binaries' _SEGGER_RTT at the same address. Reduced from 4 KB to
# 4 KB to accommodate the boot-time preamble burst (~1.5 KB of
# `emit_startup_preamble` in src/main.c) on top of the regular
# pre-main and pre-host-attach LOG output (~1 KB of MCUBoot + early
# init lines). At 2 KB the preamble was being trimmed from the
# up-buffer before openocd could drain it, even with 50 ms per-line
# pacing. Verified against chip RTT capture. Costs +2 KB RAM (RTT
# section is in noinit; doesn't grow .bss). Must match
# sysbuild/mcuboot.conf so MCUBoot and app's _SEGGER_RTT control
# block end up at the same RAM address (see comment above).
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Reboot
CONFIG_REBOOT=y

# IPC (zbus for decoupled inter-module communication)
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y

# State Machine Framework — flat-only, no hierarchical / initial-transition support.
# See docs/STATE_MACHINES.md for the modules that use it.
CONFIG_SMF=y
# CONFIG_SMF_ANCESTOR_SUPPORT is not set
# CONFIG_SMF_INITIAL_TRANSITION is not set

# ---- MCUBoot + OTA support ----
# Build app as an MCUBoot-compatible image (slot0). Sysbuild also
# pulls in the bootloader as a child image — see sysbuild.conf and
# sysbuild/mcuboot.conf.
CONFIG_BOOTLOADER_MCUBOOT=y

# Bootutil library — exposes boot_swap_type, boot_read_bank_header,
# bootutil_img_validate to the application so it can interrogate
# MCUBoot state and pre-validate slot1 before triggering activation.
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

# Image manager API — boot_request_upgrade, boot_write_img_confirmed,
# boot_is_img_confirmed.
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y

# Buffered flash writer for the OTA RX path. This is a write-coalescing
# buffer, NOT an erase buffer — flash_img_buffered_write() accumulates
# incoming UDS payload bytes and flushes when full. Sector erase is
# handled internally by the DFU subsystem at sector boundaries based on
# the running write offset, independent of the buffer size. Only
# constraint: must be >= the flash write block size (256 B page on
# W25Q512JV). 1024 chosen to keep per-flush SPI overhead low while
# costing only 1 KB of RAM vs. the previous 4 KB.
CONFIG_IMG_BLOCK_BUF_SIZE=1024
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y

# SHA-256 walk over a flash area — used by the UDS-OTA pre-activation
# pipeline to verify slot1 matches the SHA-256 TLV embedded in the
# image trailer before boot_request_upgrade() is allowed to run.
CONFIG_IMG_ENABLE_IMAGE_CHECK=y

# ---- Analog oxygen cells (external ADS1115 ADCs) ----
# Use the board-local multi-channel ADS1X1X driver (drivers/ads1x1x) instead of
# the upstream single-channel one. The upstream driver only supports channel_id
# 0, so a second analog cell sharing one ADS1115 (e.g. AIN2-AIN3) silently never
# reads. The fork stores per-channel MUX config and programs it per conversion.
# Disable the in-tree driver so only one instantiates the ti,ads1115 nodes.
CONFIG_ADC=y
CONFIG_ADC_ADS1X1X=n
CONFIG_ADC_ADS1X1X_LOCAL=y

# ---- Settings + NVS on external SPI NOR ----
# Storage partition (label "storage") now lives at the top of the
# 64 MB external NOR — see DTS partition map. Zephyr settings
# subsystem auto-discovers it via the storage_partition node name.
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

# SPI NOR exposes 4 KB sector erase and 64 KB block erase. The
# default layout page size (65536) overflows the NVS sector-size
# check (must fit in UINT16, max 65535 — exactly 1 byte short).
# Switch to 4096 so the settings subsystem can mount the storage
# partition cleanly. The 32 KB storage partition is then 8 sectors
# (= CONFIG_SETTINGS_NVS_SECTOR_COUNT range).
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Factory-image copy chunk size — read/write loop only, not erase-related.
# 1 KB gives 220 loop iterations across the 220 KB slot at ~hundreds of
# microseconds per SPI read+write; the watchdog feeds inside the loop.
# Was 4 KB by default; the "matches sector erase" rationale in the
# original Kconfig help is wrong — the bulk erase happens before the
# copy loop starts.
CONFIG_FACTORY_IMAGE_CHUNK_SIZE=1024

# ---- Flash log (FCB-based dive log) ----
# Two parallel FCB instances on external SPI NOR — telemetry FCB
# for structured records and text FCB for LOG_x capture. Each
# declares 100 × 64 KiB logical sectors (block-erase). See
# docs/FLASH_LOG.md and src/flash_log/.
CONFIG_FLASH_LOG=y
CONFIG_FCB=y
CONFIG_FCB_ALLOW_FIXED_ENDMARKER=y
# Used to stamp reset_cause in the BOOT_MARKER entry
CONFIG_HWINFO=y

# ---- Thread stack instrumentation (belt and braces) ----
# Two complementary tools share one goal — keeping stack budgets honest:
#   - Static: scripts/stack_analysis.sh walks .su + RTL dumps to compute
#     worst-case stack per function (upper bounds, derived at build time).
#   - Runtime: INIT_STACKS fills each stack with a sentinel pattern at spawn
#     time so targeted high-water-mark builds can count untouched bytes.
# The always-on paced thread analyzer was removed from production builds to
# fund the UDS RX stack margin found necessary by HIL crash-injection testing.
# Re-enable only in a temporary measurement build.
# CONFIG_THREAD_ANALYZER is not set
# CONFIG_THREAD_ANALYZER_USE_LOG is not set
# AUTO mode disabled — its tight emission loop floods 40+ LOG_INF
# back-to-back from a single thread tick, overflowing the 1 KB
# deferred log buffer (LOG_MODE_OVERFLOW=y evicts oldest, so the
# first half of the dump disappears). We run our own paced wrapper
# in src/thread_analyzer_paced.c that calls thread_analyzer_run()
# with a callback that LOG_INFs one thread, k_msleeps 50 ms to let
# the log subsystem drain, then proceeds. Same output, no drops.
# CONFIG_THREAD_ANALYZER_AUTO is not set
# Analyzer auto mode remains disabled; use src/thread_analyzer_paced.c only in
# deliberate measurement builds where CONFIG_THREAD_ANALYZER is re-enabled.
# CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE is not set
CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y

# scripts/wcs.py static-WCS for fl_writer is ~336 B but the RUNTIME high-water was
# ~944-984 B (thread_analyzer / check_high_water) — the static tool under-counts the
# FCB/flash/spi_nor call depth, and the two ~100 B header+payload coalescing buffers
# (fl_write_entry_to_fcb + fl_write_telemetry_batch Pass B) used to sit on this stack,
# BOTH live at once on the Pass-1 chain (~200 B). Those are now a single shared static
# (fl_writer_scratch, 108 B) — the writer is the only thread on the FCB path and the
# passes run sequentially, so it is safe. -fstack-usage confirms the deepest chain
# dropped ~200 B (fl_batch_flush 216->112, fl_write_entry_to_fcb 168->72); since the
# flash/SPI tail is unchanged the runtime high-water drops by the same ~200 B, i.e.
# to ~760-790 B. Audited: NO unbounded items (no alloca/VLA/recursion). Kept at 1024
# (NOT reduced) on purpose: the rare fcb_rotate()/256 KiB sector-erase path is deeper
# than the normal-append sample and remains UNMEASURED, so 1024 preserves a strict
# margin gain on every path (~234 B normal, +200 B vs before on rotation) rather than
# trading it away. (NOT the #5 crash — that was cal_thread, see calibration.c.)
# Open validation: re-run scripts/check_high_water.py on hardware, ideally forcing a
# ring wrap, before reducing this. RAM cost of the static: +64 B (AP 144->80 B free).
CONFIG_FLASH_LOG_WRITER_STACK=1024
