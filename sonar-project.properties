sonar.projectKey=QuickRecon_DiveCANHead
sonar.organization=quickrecon
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# C/C++ analysis uses the compilation database produced by
# .github/workflows/build.yml (all production ARM variants, with the
# widest-feature Poseidon_Aren commands taking precedence, merged with the
# native_sim test builds). C files not present in the DB are skipped by the
# analyzer rather than guessed at — this is what eliminates the Zephyr-macro
# false positives that Automatic Analysis produced.
sonar.cfamily.compile-commands=compile_commands.json

# Generated by Firmware/scripts/coverage.py after the coverage-instrumented
# native ztests and integration pytest suite have executed.
sonar.coverageReportPaths=Firmware/coverage-report/coverage.xml

# Generated by the DiveCAN_bt Vitest suite. The workflow normalizes the LCOV
# source paths against this repository root before starting the scan.
sonar.javascript.lcov.reportPaths=DiveCAN_bt/coverage/lcov.info
# Firmware/scripts/** is build/CI tooling (stack analysis, native-test
# runner, coverage driver, image signing) — not shipped firmware, so it
# carries no coverage requirement. Firmware/drivers/gpio_sim/** is
# native-test scaffolding, deliberately excluded from the gcovr report
# (see COVERAGE_EXCLUDES in Firmware/scripts/coverage.py), so Sonar must
# not count it as uncovered product code either.
# DiveCAN_bt UI-layer files (PlotManager, CellUIAdapter, DeviceManager) are
# pure-DOM rendering glue with no protocol logic — excluded from coverage
# alongside index.js (they are still analyzed for code quality).
# Firmware/src/thread_analyzer_paced.c cannot execute on native_sim
# (thread_analyzer_run is `depends on !ARCH_POSIX`); it is observability-only
# and exercised on the HIL rig every 30 s.
# Firmware/src/option_bytes.c reads live STM32 FLASH option-byte registers;
# a mock seam would test only the mock. Verified on hardware at every boot.
sonar.coverage.exclusions=\
    DiveCAN_bt/src/index.js,\
    DiveCAN_bt/src/**/*.test.js,\
    DiveCAN_bt/src/diagnostics/PlotManager.js,\
    DiveCAN_bt/src/diagnostics/CellUIAdapter.js,\
    DiveCAN_bt/src/DeviceManager.js,\
    Firmware/src/thread_analyzer_paced.c,\
    Firmware/src/option_bytes.c,\
    Firmware/scripts/**,\
    Firmware/drivers/gpio_sim/**

# West workspace dirs — managed by `west init`, not source-controlled.
# Mirrored from .gitignore so any scanner run from this dir skips them.
# Firmware/proprietary/** is the closed-source out-of-tree LF module (git-ignored).
sonar.exclusions=\
    zephyr/**,\
    modules/**,\
    bootloader/**,\
    tools/edtt/**,\
    tools/net-tools/**,\
    Firmware/proprietary/**,\
    Firmware/build/**,\
    Firmware/build-variants/**,\
    Firmware/build-native/**,\
    Firmware/build-coverage/**,\
    Firmware/build_*/**,\
    Firmware/build-fwc/**,\
    Firmware/build_pos/**,\
    Firmware/coverage-report/**,\
    STM32/Tests/cpputest/**,\
    **/node_modules/**

# NOTE: the legacy STM32/FreeRTOS firmware (STM32/**) is intentionally NOT
# excluded here, but its C sources have no entries in the CI compilation
# database, so the C analyzer skips them automatically. Add STM32/** above if
# you want it gone from the dashboard entirely once the pivot lands.
