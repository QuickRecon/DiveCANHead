name: Build + SonarCloud Analysis

# CI-based SonarCloud scan with a real compilation database, replacing
# Automatic Analysis (which parses C without macro resolution and produces
# thousands of false positives on Zephyr macros: ZTEST, zassert_*, LOG_*).
# Requires: SONAR_TOKEN repo secret; Automatic Analysis switched OFF in the
# SonarCloud UI (Administration -> Analysis Method) once this workflow is green.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Build firmware + tests, scan
    runs-on: [self-hosted, docker]
    timeout-minutes: 90
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/.ci-cache/zephyr-sdk
    steps:
      # The repository contains two legacy gitlinks without matching
      # .gitmodules entries. actions/checkout traverses submodules while
      # removing its temporary credentials and fails before the job can start.
      # This public, read-only checkout fetches full history without installing
      # credentials or invoking any submodule commands.
      - name: Checkout (full history for new-code detection and blame)
        env:
          CI_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          CI_EVENT_REF: ${{ github.ref }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_RUN_REF: refs/remotes/ci/${{ github.run_id }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -d .git ]; then
            git init .
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$CI_REPOSITORY_URL"
          else
            git remote add origin "$CI_REPOSITORY_URL"
          fi
          git fetch --force --prune --no-recurse-submodules origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            "+${CI_EVENT_REF}:${CI_RUN_REF}"
          git checkout --force "$CI_EVENT_SHA"
          git clean -ffdx

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gcc-multilib g++-multilib ninja-build device-tree-compiler \
            ccache jq iproute2 kmod

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Firmware/tests/integration/harness/requirements.txt
            Firmware/west.yml

      # west.yml pins Zephyr and therefore fully identifies the module graph.
      - name: Restore west modules
        id: west-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .west
            zephyr
            modules
            bootloader
            tools
          key: west-${{ runner.os }}-${{ hashFiles('Firmware/west.yml') }}
          restore-keys: |
            west-${{ runner.os }}-

      # `west packages pip --install` refuses to run outside a virtualenv, so
      # all Python tooling lives in one; putting its bin dir on GITHUB_PATH
      # makes every later step (west build, native_test.py) use it too.
      - name: Create Python virtualenv
        run: |
          python3 -m venv "$HOME/zephyr-venv"
          echo "$HOME/zephyr-venv/bin" >> "$GITHUB_PATH"

      - name: Initialize west workspace
        run: |
          pip install west gcovr \
            -r Firmware/tests/integration/harness/requirements.txt
          if [ ! -d .west ]; then
            west init -l Firmware
          fi
          west update --narrow -o=--depth=1
          west packages pip --install

      - name: Save west modules
        if: steps.west-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .west
            zephyr
            modules
            bootloader
            tools
          key: ${{ steps.west-cache.outputs.cache-primary-key }}

      - name: Restore Zephyr SDK
        id: zephyr-sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          key: zephyr-sdk-v2-${{ runner.os }}-${{ hashFiles('zephyr/SDK_VERSION') }}

      - name: Install Zephyr SDK (ARM toolchain + host tools)
        if: steps.zephyr-sdk-cache.outputs.cache-hit != 'true'
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          west sdk install \
            --personal-access-token "$GH_API_TOKEN" \
            --install-dir "$ZEPHYR_SDK_INSTALL_DIR" \
            -t arm-zephyr-eabi

      - name: Save Zephyr SDK
        if: steps.zephyr-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          key: ${{ steps.zephyr-sdk-cache.outputs.cache-primary-key }}

      # The ARM variant build covers src/ and drivers/ under the shipped
      # firmware configuration (Poseidon_Aren = most features enabled).
      - name: Build Poseidon_Aren firmware (sysbuild)
        working-directory: Firmware
        run: |
          west build -d build -b divecan_jr/stm32l431xx . --sysbuild -p always -- \
            -DBOARD_ROOT=. \
            -DEXTRA_CONF_FILE=variants/Poseidon_Aren.conf \
            -DEXTRA_DTC_OVERLAY_FILE=variants/Poseidon_Aren.overlay

      - name: Configure virtual CAN for integration tests
        run: |
          if ! ip link show vcan0 >/dev/null 2>&1; then
            sudo modprobe vcan || true
            sudo ip link add dev vcan0 type vcan
          fi
          sudo ip link set dev vcan0 up
          ip -details link show vcan0

      # Each ztest owns a separate build directory, so the coverage builds and
      # executions are safe to parallelise. Use half the logical CPUs to avoid
      # memory pressure from too many simultaneous compiler/linker processes.
      - name: Build coverage-instrumented native tests
        working-directory: Firmware
        run: |
          python3 scripts/coverage.py clean
          mapfile -t native_tests < <(python3 scripts/native_test.py list)
          native_jobs=$(( ($(nproc) + 1) / 2 ))
          printf '%s\0' "${native_tests[@]}" |
            xargs -0 -r -n 1 -P "$native_jobs" \
              python3 scripts/native_test.py build --coverage
          python3 scripts/coverage.py build-integration

      - name: Run native tests and collect coverage
        working-directory: Firmware
        run: |
          mapfile -t native_tests < <(python3 scripts/native_test.py list)
          native_jobs=$(( ($(nproc) + 1) / 2 ))
          printf '%s\0' "${native_tests[@]}" |
            xargs -0 -r -n 1 -P "$native_jobs" \
              python3 scripts/native_test.py run --coverage
          python3 scripts/coverage.py run-pytest
          python3 scripts/coverage.py report
          test -s coverage-report/coverage.xml
          grep -q '<file path="Firmware/src/' coverage-report/coverage.xml

      - name: Merge compilation databases
        run: |
          # ARM app DB listed first: for src/ files present in several DBs,
          # keep the first (ARM/variant) entry so production code is analyzed
          # under the shipped configuration, not a test build. Native DBs then
          # contribute tests/** and files never compiled for ARM.
          jq -s '
            [ .[][] ]
            | reduce .[] as $e ({seen: {}, out: []};
                if .seen[$e.file] then .
                else {seen: (.seen + {($e.file): true}),
                      out: (.out + [$e])} end)
            | .out
          ' Firmware/build/Firmware/compile_commands.json \
            Firmware/build-coverage/*/compile_commands.json \
            > compile_commands.json
          echo "Merged compilation database: $(jq length compile_commands.json) entries"

      - name: Archive coverage report
        uses: actions/upload-artifact@v6
        with:
          name: firmware-coverage-${{ github.run_id }}
          path: Firmware/coverage-report/
          retention-days: 14

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
